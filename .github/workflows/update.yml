name: Update Nikkei data

on:
  schedule:
    # 平日 16:10 JST (= 07:10 UTC) に実行。日経平均の取引終了(15:00 JST)後を想定。
    - cron: "10 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: データ取得と指標計算
        run: node scripts/fetch-and-compute.mjs

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet && echo "変更なし" || git commit -m "chore: update nikkei data"
          git push
